<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Adapt-1 FLE arm comparison</title>
  <desc id="desc">Final production score and execution error rate for baseline, warm frozen, domain only, and memory only arms.</desc>
  <rect width="960" height="480" fill="#f7f4ef"/>
  <style>
    .title{font:700 22px system-ui,sans-serif;fill:#1c1a17}
    .label{font:13px system-ui,sans-serif;fill:#3f3a33}
    .small{font:11px system-ui,sans-serif;fill:#5c564c}
    .axis{stroke:#8c8579;stroke-width:1}
    .grid{stroke:#d9d2c5;stroke-width:1}
    .value{font:700 12px system-ui,sans-serif;fill:#1c1a17;text-anchor:middle}
  </style>
  <text x="42" y="36" class="title">Matched local-model evaluation (N=10 per arm)</text>

  <text x="42" y="72" class="label">Mean final production score</text>
  <line x1="70" y1="360" x2="445" y2="360" class="axis"/>
  <line x1="70" y1="110" x2="70" y2="360" class="axis"/>
  <line x1="70" y1="235" x2="445" y2="235" class="grid"/>
  <line x1="70" y1="110" x2="445" y2="110" class="grid"/>
  <text x="60" y="365" class="small" text-anchor="end">0</text>
  <text x="60" y="240" class="small" text-anchor="end">2.5</text>
  <text x="60" y="115" class="small" text-anchor="end">5</text>
  <rect x="100" y="145" width="58" height="215" fill="#0f5c4c"/>
  <rect x="190" y="360" width="58" height="0" fill="#b85c38"/>
  <rect x="280" y="315" width="58" height="45" fill="#557a95"/>
  <rect x="370" y="315" width="58" height="45" fill="#8774a8"/>
  <text x="129" y="137" class="value">4.3</text>
  <text x="219" y="350" class="value">0.0</text>
  <text x="309" y="307" class="value">0.9</text>
  <text x="399" y="307" class="value">0.9</text>
  <text x="129" y="382" class="small" text-anchor="middle">baseline</text>
  <text x="219" y="382" class="small" text-anchor="middle">warm</text>
  <text x="309" y="382" class="small" text-anchor="middle">domain</text>
  <text x="399" y="382" class="small" text-anchor="middle">memory</text>

  <text x="520" y="72" class="label">Execution error rate (lower is better)</text>
  <line x1="550" y1="360" x2="925" y2="360" class="axis"/>
  <line x1="550" y1="110" x2="550" y2="360" class="axis"/>
  <line x1="550" y1="235" x2="925" y2="235" class="grid"/>
  <line x1="550" y1="110" x2="925" y2="110" class="grid"/>
  <text x="540" y="365" class="small" text-anchor="end">0%</text>
  <text x="540" y="240" class="small" text-anchor="end">30%</text>
  <text x="540" y="115" class="small" text-anchor="end">60%</text>
  <rect x="580" y="141.25" width="58" height="218.75" fill="#0f5c4c"/>
  <rect x="670" y="224.58" width="58" height="135.42" fill="#b85c38"/>
  <rect x="760" y="214.17" width="58" height="145.83" fill="#557a95"/>
  <rect x="850" y="130.83" width="58" height="229.17" fill="#8774a8"/>
  <text x="609" y="133" class="value">52.5%</text>
  <text x="699" y="216" class="value">32.5%</text>
  <text x="789" y="206" class="value">35.0%</text>
  <text x="879" y="123" class="value">55.0%</text>
  <text x="609" y="382" class="small" text-anchor="middle">baseline</text>
  <text x="699" y="382" class="small" text-anchor="middle">warm</text>
  <text x="789" y="382" class="small" text-anchor="middle">domain</text>
  <text x="879" y="382" class="small" text-anchor="middle">memory</text>

  <text x="42" y="430" class="small">All arms: 0/10 task successes (Wilson 95% CI 0-27.8%).</text>
  <text x="42" y="450" class="small">Domain guidance reduced execution errors but also reduced production; all Domain selections were &quot;inspect&quot;.</text>
</svg>
