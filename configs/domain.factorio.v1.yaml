revision: "1"
domain_id: factorio-strategy-v1
description: >-
  Select high-level factory strategies from public FLE observations and revise
  their support from exact execution outcomes across ordered Factorio episodes.
schema:
  entities:
    - task
    - factory_state
    - inventory
    - production_flow
    - strategy
    - execution
    - outcome
  relations:
    - advances_goal
    - changes_state
    - supported_by
  event_types:
    - factorio_observation
    - factorio_execution
    - factorio_transition
    - factorio_terminal
  signals:
    - phase
    - task_key
    - target_item
    - progress
    - production_score
    - automated_production_score
    - inventory
    - entity_counts
    - entity_status_counts
    - execution_error
  actions:
    inspect: Observe recipes, resources, inventories, geometry, or entity status.
    gather: Harvest or acquire a small amount of missing bootstrap material.
    craft: Manually craft only the minimum components needed to unlock automation.
    power: Build, fuel, connect, repair, or expand electrical generation.
    mine: Build, fuel, connect, repair, or expand automated resource extraction.
    smelt: Build, fuel, connect, repair, or expand automated material processing.
    logistics: Route material with belts, inserters, chests, pipes, or power poles.
    assemble: Build or repair automated intermediate and target-item production.
    research: Build science production, operate labs, or unlock required technology.
    debug: Diagnose and repair an error, blockage, starvation, or invalid layout.
    optimize: Increase throughput, remove bottlenecks, and replace manual handling.
    verify: Let the factory run, measure flows, and validate the task condition.
  outcomes:
    progress: Public production progress increased.
    no_progress: No public production progress was observed.
    execution_error: The exact Python action failed or produced an FLE error.
    success: The public task verifier reached its terminal success condition.
  result_contract:
    relation: advances_goal
    value: one strategy identifier from schema.actions
hypotheses:
  - id: inspect
    relation: advances_goal
    policy: inspect
    predicts: A targeted observation reduces missing evidence for the next commitment.
  - id: gather
    relation: advances_goal
    policy: gather
    predicts: Acquiring bootstrap resources enables the next automation action.
  - id: craft
    relation: advances_goal
    policy: craft
    predicts: Minimal manual crafting enables automated infrastructure.
  - id: power
    relation: advances_goal
    policy: power
    predicts: Working electrical supply enables or restores powered production.
  - id: mine
    relation: advances_goal
    policy: mine
    predicts: Automated extraction increases usable raw-material flow.
  - id: smelt
    relation: advances_goal
    policy: smelt
    predicts: Automated processing increases usable plate or material flow.
  - id: logistics
    relation: advances_goal
    policy: logistics
    predicts: Material routing connects working production stages.
  - id: assemble
    relation: advances_goal
    policy: assemble
    predicts: Automated recipes increase production of intermediates or the target.
  - id: research
    relation: advances_goal
    policy: research
    predicts: Technology progress unlocks required production capability.
  - id: debug
    relation: advances_goal
    policy: debug
    predicts: Repairing the observed failure restores intended operation.
  - id: optimize
    relation: advances_goal
    policy: optimize
    predicts: Removing a measured bottleneck increases automated throughput.
  - id: verify
    relation: advances_goal
    policy: verify
    predicts: Observing the running factory confirms stable automated throughput.
query_templates:
  strategy_selection:
    relation: advances_goal
    result: policy_scores
    available_policies:
      - inspect
      - gather
      - craft
      - power
      - mine
      - smelt
      - logistics
      - assemble
      - research
      - debug
      - optimize
      - verify
learning:
  enabled: true
  credit_assignment:
    neutral_reward: 0.0
  sequential:
    enabled: true
