revision: "local-research-1"
description: >-
  Resource-bounded local-model study: expose Adapt-1 to extraction and basic
  processing, then evaluate frozen retention and transfer. With four steps per
  run this curriculum uses 32 Domain feedback records across eight episodes;
  selective Memory can add at most 32 more records.
stages:
  - name: extraction
    episodes_per_task: 4
    tasks:
      - iron_ore_throughput
  - name: processing
    episodes_per_task: 4
    tasks:
      - iron_plate_throughput
held_out_tasks:
  - iron_gear_wheel_throughput
transfer_tasks: []
benchmark_arms:
  - baseline
  - warm_frozen
  - domain_only
  - memory_only
